<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Minimal Dark Background -->
  <rect width="600" height="600" fill="#332d29" />

  <!-- Determinant Vertical Bars -->
  <line x1="185" y1="85" x2="185" y2="265" stroke="#f3f1ee" stroke-width="4.5" stroke-linecap="round" />
  <line x1="415" y1="85" x2="415" y2="265" stroke="#f3f1ee" stroke-width="4.5" stroke-linecap="round" />

  <!-- Matrix Elements -->
  <text x="240" y="152" fill="#f3f1ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="700" text-anchor="middle">2</text>
  <text x="360" y="152" fill="#f3f1ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="700" text-anchor="middle">1</text>
  <text x="240" y="242" fill="#f3f1ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="700" text-anchor="middle">3</text>
  <text x="360" y="242" fill="#f3f1ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="700" text-anchor="middle">4</text>

  <!-- Crossing Diagonal Arrows: Clean, perfectly positioned without colliding with numbers -->
  <!-- Green Arrow: Diagonal Down-Right (2 -> 4) -->
  <line x1="262" y1="135" x2="332" y2="218" stroke="#62ba4e" stroke-width="4" stroke-linecap="round" />
  <polygon points="342,228 328,222 338,211" fill="#62ba4e" />

  <!-- Orange Arrow: Diagonal Down-Left (1 -> 3) -->
  <line x1="338" y1="135" x2="268" y2="218" stroke="#f37d36" stroke-width="4" stroke-linecap="round" />
  <polygon points="258,228 262,211 272,222" fill="#f37d36" />

  <!-- Determinant Formula -->
  <text x="300" y="340" fill="#f3f1ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" text-anchor="middle">(2×4) − (1×3)</text>

  <!-- Clean Downward Arrow -->
  <line x1="300" y1="368" x2="300" y2="398" stroke="#9e9790" stroke-width="3.5" stroke-linecap="round" />
  <polygon points="300,410 292,395 308,395" fill="#9e9790" />

  <!-- Intermediate Subtraction Step -->
  <text x="300" y="462" fill="#f3f1ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" text-anchor="middle">8 − 3</text>

  <!-- Final Evaluated Answer in Signature Green -->
  <text x="300" y="534" fill="#62ba4e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" text-anchor="middle">= 5</text>
</svg>
