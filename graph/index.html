<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenali — Puzzle Prerequisite Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f1117; color: #e0e0e0; overflow: hidden; }

#toolbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  background: rgba(15,17,23,0.92); backdrop-filter: blur(8px);
  border-bottom: 1px solid #2a2d3a;
  padding: 10px 20px; display: flex; align-items: center; gap: 16px;
  flex-wrap: wrap;
}
#toolbar h1 { font-size: 1.1rem; font-weight: 600; color: #fff; white-space: nowrap; }
#toolbar .subtitle { font-size: 0.78rem; color: #888; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; color: #aaa; }
.legend-dot { width: 12px; height: 12px; border-radius: 3px; }
.btn { background: #1e2030; border: 1px solid #3a3d4a; color: #ccc; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.78rem; }
.btn:hover { background: #2a2d40; color: #fff; }

svg { width: 100vw; height: 100vh; }

.node rect {
  rx: 8; ry: 8;
  stroke-width: 2;
  cursor: pointer;
  transition: filter 0.2s;
}
.node:hover rect { filter: brightness(1.25) drop-shadow(0 0 8px rgba(255,255,255,0.15)); }
.node text { font-family: 'Segoe UI', system-ui, sans-serif; pointer-events: none; }
.node-label { font-size: 12px; font-weight: 600; fill: #fff; }
.node-sub { font-size: 9px; fill: rgba(255,255,255,0.65); }

.edge path {
  fill: none; stroke: #4a4d5a; stroke-width: 1.8;
  marker-end: url(#arrowhead);
}
.edge.highlighted path { stroke: #ffb300; stroke-width: 2.6; }
.edge.highlighted-reverse path { stroke: #42a5f5; stroke-width: 2.6; }

.node.dimmed rect { opacity: 0.15; }
.node.dimmed text { opacity: 0.15; }
.edge.dimmed path { opacity: 0.06; }

#tooltip {
  position: fixed; display: none; z-index: 20;
  background: #1e2030; border: 1px solid #3a3d4a; border-radius: 8px;
  padding: 10px 14px; max-width: 280px;
  font-size: 0.8rem; line-height: 1.45; color: #ccc;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  pointer-events: none;
}
#tooltip .tt-title { font-weight: 600; color: #fff; margin-bottom: 4px; font-size: 0.88rem; }
#tooltip .tt-prereqs { color: #ffb300; }
#tooltip .tt-unlocks { color: #42a5f5; }
</style>
</head>
<body>

<div id="toolbar">
  <div>
    <h1>Tenali Prerequisite Graph</h1>
    <div class="subtitle">Directed arrows show "must know before". Click a node to highlight its dependency chain.</div>
  </div>
  <button class="btn" onclick="resetView()">Reset View</button>
  <button class="btn" onclick="fitAll()">Fit All</button>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#ef5350"></div>Arithmetic</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ab47bc"></div>Algebra</div>
    <div class="legend-item"><div class="legend-dot" style="background:#42a5f5"></div>Geometry</div>
    <div class="legend-item"><div class="legend-dot" style="background:#66bb6a"></div>Calculus</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ffa726"></div>Statistics &amp; Probability</div>
    <div class="legend-item"><div class="legend-dot" style="background:#26c6da"></div>Vectors &amp; Matrices</div>
    <div class="legend-item"><div class="legend-dot" style="background:#8d6e63"></div>Number Theory</div>
    <div class="legend-item"><div class="legend-dot" style="background:#78909c"></div>Other</div>
  </div>
</div>

<div id="tooltip">
  <div class="tt-title"></div>
  <div class="tt-body"></div>
</div>

<svg id="graph"></svg>

<script>
async function boot() {
  const res = await fetch('./graph-data.json')
  const { categories, nodes, edges } = await res.json()

  const catColor = Object.fromEntries(Object.entries(categories).map(([id, c]) => [id, c.color]))
  const catColorDark = Object.fromEntries(Object.entries(categories).map(([id, c]) => [id, c.colorDark]))


// ═══════════════════════════════════════════════════════════════
// BUILD DAGRE LAYOUT
// ═══════════════════════════════════════════════════════════════
const g = new dagre.graphlib.Graph()
g.setGraph({ rankdir: 'TB', nodesep: 30, ranksep: 60, marginx: 40, marginy: 40 })
g.setDefaultEdgeLabel(() => ({}))

const nodeMap = {}
nodes.forEach(n => {
  nodeMap[n.id] = n
  g.setNode(n.id, { width: 150, height: 52 })
})
edges.forEach(([src, tgt]) => g.setEdge(src, tgt))
dagre.layout(g)

// ═══════════════════════════════════════════════════════════════
// RENDER WITH D3
// ═══════════════════════════════════════════════════════════════
const svg = d3.select('#graph')
const defs = svg.append('defs')

// Arrowhead marker
defs.append('marker')
  .attr('id', 'arrowhead')
  .attr('viewBox', '0 0 10 10')
  .attr('refX', 10).attr('refY', 5)
  .attr('markerWidth', 8).attr('markerHeight', 8)
  .attr('orient', 'auto-start-reverse')
  .append('path')
  .attr('d', 'M 0 0 L 10 5 L 0 10 Z')
  .attr('fill', '#4a4d5a')

// Highlighted arrowheads
defs.append('marker')
  .attr('id', 'arrowhead-gold')
  .attr('viewBox', '0 0 10 10')
  .attr('refX', 10).attr('refY', 5)
  .attr('markerWidth', 8).attr('markerHeight', 8)
  .attr('orient', 'auto-start-reverse')
  .append('path')
  .attr('d', 'M 0 0 L 10 5 L 0 10 Z')
  .attr('fill', '#ffb300')

defs.append('marker')
  .attr('id', 'arrowhead-blue')
  .attr('viewBox', '0 0 10 10')
  .attr('refX', 10).attr('refY', 5)
  .attr('markerWidth', 8).attr('markerHeight', 8)
  .attr('orient', 'auto-start-reverse')
  .append('path')
  .attr('d', 'M 0 0 L 10 5 L 0 10 Z')
  .attr('fill', '#42a5f5')

const container = svg.append('g').attr('class', 'container')

// Zoom & pan
const zoom = d3.zoom()
  .scaleExtent([0.15, 3])
  .on('zoom', (e) => container.attr('transform', e.transform))
svg.call(zoom)

// Edge path helper
function edgePath(e) {
  const pts = g.edge(e).points
  if (!pts || pts.length < 2) return ''
  const line = d3.line().x(d => d.x).y(d => d.y).curve(d3.curveBasis)
  return line(pts)
}

// Draw edges
const edgeGroup = container.append('g').attr('class', 'edges')
const edgeEls = edgeGroup.selectAll('.edge')
  .data(g.edges())
  .join('g')
  .attr('class', 'edge')
  .attr('data-src', d => d.v)
  .attr('data-tgt', d => d.w)

edgeEls.append('path').attr('d', d => edgePath(d))

// Draw nodes
const nodeGroup = container.append('g').attr('class', 'nodes')
const nodeEls = nodeGroup.selectAll('.node')
  .data(g.nodes().map(id => ({ id, ...g.node(id), ...nodeMap[id] })))
  .join('g')
  .attr('class', 'node')
  .attr('data-id', d => d.id)
  .attr('transform', d => `translate(${d.x - d.width/2}, ${d.y - d.height/2})`)

nodeEls.append('rect')
  .attr('width', d => d.width)
  .attr('height', d => d.height)
  .attr('fill', d => catColorDark[d.cat])
  .attr('stroke', d => catColor[d.cat])

nodeEls.append('text')
  .attr('class', 'node-label')
  .attr('x', d => d.width / 2)
  .attr('y', 22)
  .attr('text-anchor', 'middle')
  .text(d => d.label)

nodeEls.append('text')
  .attr('class', 'node-sub')
  .attr('x', d => d.width / 2)
  .attr('y', 38)
  .attr('text-anchor', 'middle')
  .text(d => {
    const s = d.sub || ''
    return s.length > 28 ? s.slice(0, 26) + '…' : s
  })

// ═══════════════════════════════════════════════════════════════
// INTERACTIVITY: click to highlight prereq chain
// ═══════════════════════════════════════════════════════════════
// Build adjacency for traversal
const predecessors = {}  // who do I depend on?
const successors = {}    // who depends on me?
nodes.forEach(n => { predecessors[n.id] = new Set(); successors[n.id] = new Set() })
edges.forEach(([s, t]) => { predecessors[t].add(s); successors[s].add(t) })

function allAncestors(id) {
  const visited = new Set()
  const queue = [id]
  while (queue.length) {
    const cur = queue.pop()
    for (const p of predecessors[cur]) {
      if (!visited.has(p)) { visited.add(p); queue.push(p) }
    }
  }
  return visited
}
function allDescendants(id) {
  const visited = new Set()
  const queue = [id]
  while (queue.length) {
    const cur = queue.pop()
    for (const s of successors[cur]) {
      if (!visited.has(s)) { visited.add(s); queue.push(s) }
    }
  }
  return visited
}

let selectedNode = null

nodeEls.on('click', function(event, d) {
  event.stopPropagation()
  if (selectedNode === d.id) { clearHighlight(); return }
  selectedNode = d.id
  const anc = allAncestors(d.id)
  const desc = allDescendants(d.id)
  const related = new Set([d.id, ...anc, ...desc])

  // Dim everything first
  nodeEls.classed('dimmed', dd => !related.has(dd.id))
  edgeEls.classed('dimmed', true)
    .classed('highlighted', false)
    .classed('highlighted-reverse', false)
  edgeEls.select('path')
    .attr('marker-end', 'url(#arrowhead)')

  // Highlight ancestor edges (gold)
  edgeEls.filter(e => anc.has(e.v) && (anc.has(e.w) || e.w === d.id))
    .classed('dimmed', false)
    .classed('highlighted', true)
    .select('path')
    .attr('marker-end', 'url(#arrowhead-gold)')

  // Highlight descendant edges (blue)
  edgeEls.filter(e => (desc.has(e.w) && (desc.has(e.v) || e.v === d.id)))
    .classed('dimmed', false)
    .classed('highlighted-reverse', true)
    .select('path')
    .attr('marker-end', 'url(#arrowhead-blue)')
})

// Tooltip
const tooltip = d3.select('#tooltip')
nodeEls.on('mouseenter', function(event, d) {
  const prereqs = [...predecessors[d.id]].map(id => nodeMap[id]?.label || id)
  const unlocks = [...successors[d.id]].map(id => nodeMap[id]?.label || id)
  let html = ''
  if (prereqs.length) html += `<div class="tt-prereqs">Prerequisites: ${prereqs.join(', ')}</div>`
  if (unlocks.length) html += `<div class="tt-unlocks">Unlocks: ${unlocks.join(', ')}</div>`
  if (!prereqs.length && !unlocks.length) html = '<div style="color:#888">No direct prerequisites or dependents</div>'

  tooltip.select('.tt-title').text(d.label)
  tooltip.select('.tt-body').html(html)
  tooltip.style('display', 'block')
})
nodeEls.on('mousemove', function(event) {
  tooltip.style('left', (event.clientX + 14) + 'px').style('top', (event.clientY + 14) + 'px')
})
nodeEls.on('mouseleave', function() {
  tooltip.style('display', 'none')
})

svg.on('click', () => clearHighlight())

function clearHighlight() {
  selectedNode = null
  nodeEls.classed('dimmed', false)
  edgeEls.classed('dimmed', false).classed('highlighted', false).classed('highlighted-reverse', false)
  edgeEls.select('path').attr('marker-end', 'url(#arrowhead)')
}

// ═══════════════════════════════════════════════════════════════
// FIT / RESET helpers
// ═══════════════════════════════════════════════════════════════
function fitAll() {
  const graph = g.graph()
  const pad = 80
  const gW = graph.width + pad * 2
  const gH = graph.height + pad * 2
  const vW = window.innerWidth
  const vH = window.innerHeight - 52
  const scale = Math.min(vW / gW, vH / gH, 1.5)
  const tx = (vW - graph.width * scale) / 2
  const ty = (vH - graph.height * scale) / 2 + 52
  svg.transition().duration(600).call(
    zoom.transform,
    d3.zoomIdentity.translate(tx, ty).scale(scale)
  )
}
function resetView() {
  clearHighlight()
  fitAll()
}

// Initial fit
fitAll()

// ═══════════════════════════════════════════════════════════════
// CYCLE CHECK (validation — logged to console)
// ═══════════════════════════════════════════════════════════════
function hasCycle() {
  const visited = new Set(), stack = new Set()
  function dfs(node) {
    visited.add(node); stack.add(node)
    for (const next of (successors[node] || [])) {
      if (stack.has(next)) return true
      if (!visited.has(next) && dfs(next)) return true
    }
    stack.delete(node); return false
  }
  for (const n of nodes) { if (!visited.has(n.id) && dfs(n.id)) return true }
  return false
}
console.log(hasCycle() ? '⚠️ CYCLE DETECTED in prerequisite graph!' : '✅ Graph is a valid DAG (no cycles)')
console.log(`Nodes: ${nodes.length}, Edges: ${edges.length}`)

window.resetView = resetView
window.fitAll = fitAll
}
boot()
</script>
</body>
</html>
