# Tenali — nginx site template
#
# Drop into /etc/nginx/sites-available/tenali and symlink into sites-enabled.
# Replace <PROD_HOST> with the public hostname (e.g. tenali.fun) and
# <LETSENCRYPT_EMAIL> with the address Let's Encrypt should register.
#
# Why this exists: Tenali runs as a single Express process that serves BOTH
# the static React build and every /<type>-api, /api, and /socket.io route.
# nginx must proxy everything to that process — never serve a static build
# at the root, because that build's API calls go to /api/* and /<type>-api/*
# without the /summership/ prefix, which nginx would then intercept with
# its own static fallback (the bug that produced the June-2 stale-shell
# incident).
#
# If you only want the sub-path deployment, the "redirect / to /summership/"
# block can be dropped; if you only want the root deployment, change
# `proxy_pass http://127.0.0.1:4000;` to also serve /summership/ from the
# same upstream (the Express server already does this when
# VITE_BASE_PATH=/summership is set at build time).

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name <PROD_HOST>;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <PROD_HOST>;

    ssl_certificate     /etc/letsencrypt/live/<PROD_HOST>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<PROD_HOST>/privkey.pem;

    # HSTS — 6 months, includeSubDomains. Bump after you've confirmed the
    # whole stack serves HTTPS reliably.
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 6 MB body cap covers the worst quiz payloads; rejects oversized POSTs
    # before they hit the Express body parser.
    client_max_body_size 6m;

    # Logs — split access/error so a noisy quiz session can't drown out
    # real 5xx errors.
    access_log /var/log/nginx/tenali.access.log;
    error_log  /var/log/nginx/tenali.error.log;

    # Everything is a reverse proxy to the Express process on :4000.
    # This is the ONLY way to serve /api/*, /<type>-api/*, and /socket.io/*
    # correctly — the Express process is the source of truth for both the
    # React bundle and the quiz APIs.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Socket.IO's WebSocket upgrade.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  75s;
        proxy_send_timeout  75s;

        proxy_buffering off;
    }
}
