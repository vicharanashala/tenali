# Tenali — nginx site template
#
# Drop into /etc/nginx/sites-available/tenali and symlink into sites-enabled.
# Replace <PROD_HOST> with the public hostname (e.g. tenali.fun) and
# <LETSENCRYPT_EMAIL> with the address Let's Encrypt should register.
#
# Why this exists: every Tenali app is a single Express process that serves
# BOTH the static React build and every /<type>-api, /api, and /socket.io
# route. nginx must proxy everything to those processes — never serve a static
# build at the root, because that build's API calls go to /api/* and
# /<type>-api/* without the sub-path prefix, which nginx would then intercept
# with its own static fallback (the bug that produced the June-2 stale-shell
# incident).
#
# Topology served by this file (one nginx, three Express apps, three ports):
#
#   /                 → tenali-root branch   → 127.0.0.1:4003
#   /summership/      → main branch          → 127.0.0.1:4001
#   /matrixmystics/   → matrix-mystics branch → 127.0.0.1:4004
#
# Each app owns a sub-path of the same hostname, so every location below is a
# PROXY. A static mount (root/alias) would freeze one app's bundle while the
# other two keep shipping, which is exactly the failure this file exists to
# prevent.
#
# The trailing slash on proxy_pass is load-bearing: nginx replaces the
# matched location prefix with the trailing "/" before forwarding, so
# /summership/assets/x.js reaches the app as /assets/x.js and
# /summership/api/auth/me reaches it as /api/auth/me. The app is mounted at
# the root of its own port and never has to know its public prefix — one
# layer owns the prefix, and it is nginx.
#
# Because the prefix is stripped here, each app must run with
# SUBPATH_REDIRECT=/ (see server/deploy/systemd/*.service). If an app also
# redirected its own "/" to a sub-path, /matrixmystics/ would bounce between
# nginx and Express forever.
#
# /fln/ is served by a different repository (vicharanashala/fln) and is
# therefore deliberately not part of this template.

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name <PROD_HOST>;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <PROD_HOST>;

    ssl_certificate     /etc/letsencrypt/live/<PROD_HOST>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<PROD_HOST>/privkey.pem;

    # HSTS — 6 months, includeSubDomains. Bump after you've confirmed the
    # whole stack serves HTTPS reliably.
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 6 MB body cap covers the worst quiz payloads; rejects oversized POSTs
    # before they hit the Express body parser.
    client_max_body_size 6m;

    # Logs — split access/error so a noisy quiz session can't drown out
    # real 5xx errors.
    access_log /var/log/nginx/tenali.access.log;
    error_log  /var/log/nginx/tenali.error.log;

    # Shared proxy settings. nginx inherits these into every location below
    # because none of them redefine them — one place to change them.
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Required for Socket.IO's WebSocket upgrade.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout  75s;
    proxy_send_timeout  75s;

    proxy_buffering off;

    # --- Tenali main app (branch: main, port 4001) --------------------------
    # Bare path without the trailing slash would fall through to `location /`
    # and be answered by the root app — redirect instead of guessing.
    location = /summership {
        return 301 /summership/;
    }

    location /summership/ {
        proxy_pass http://127.0.0.1:4001/;
    }

    # --- Matrix Mystics (branch: matrix-mystics, port 4004) -----------------
    location = /matrixmystics {
        return 301 /matrixmystics/;
    }

    location /matrixmystics/ {
        proxy_pass http://127.0.0.1:4004/;
    }

    # --- Tenali root app (branch: tenali-root, port 4003) --------------------
    # Last, and it owns the domain root. This app's client is built with
    # VITE_BASE_PATH=/ so its assets are requested from /assets/*.
    location / {
        proxy_pass http://127.0.0.1:4003;
    }
}
