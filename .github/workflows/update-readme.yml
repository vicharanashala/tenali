name: 🤖 Update README contributors

# Runs whenever a commit lands on main, a PR is merged, every 12h, or manually.
# Re-generates the leaderboard + snapshot in README.md from live git log +
# GitHub API and commits the change back via github-actions[bot].

on:
  # 🚫 push and pull_request_target triggers intentionally removed.
  # The bot now fires ONLY every 12 hours via cron (and manually by admins
  # via workflow_dispatch). This keeps the bot's resource usage at ~2%
  # of the free GitHub Actions tier while still keeping the leaderboard
  # reasonably fresh (≤12h staleness).
  workflow_dispatch:
  schedule:
    # 🔁 Refresh every 12 hours so the leaderboard never goes stale
    # (UTC 00:00 and 12:00 — even if no commit/PR triggered an update)
    - cron: '0 0,12 * * *'

# Cancel any in-flight run when a new push arrives
concurrency:
  group: readme-bot
  cancel-in-progress: true

permissions:
  contents: write    # required for github-actions[bot] to push to main
  pull-requests: write

jobs:
  update-readme:
    # No event filter needed — bot now fires only on cron + manual dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so git shortlog is accurate
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 📜 Dry-run preview (for the workflow logs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "─── Leaderboard preview ───"
          node scripts/update-readme-contributors.js --dry-run | tail -80

      - name: ✍️ Regenerate README.md + CONTRIBUTORS.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pull contributor data from this (canonical) repo
          TENALI_REPO: ${{ github.repository }}
        run: node scripts/update-readme-contributors.js

      - name: 🔍 Show what changed
        run: |
          git --no-pager diff --stat README.md CONTRIBUTORS.md CHANGELOG.md
          echo "─── README.md diff ───"
          git --no-pager diff README.md | head -80 || true
          echo "─── CONTRIBUTORS.md diff ───"
          git --no-pager diff CONTRIBUTORS.md | head -80 || true
          echo "─── CHANGELOG.md diff (first 30 lines) ───"
          git --no-pager diff CHANGELOG.md | head -30 || true

      - name: 🚀 Commit via github-actions[bot]
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            🤖 docs(contributors): refresh contributor stats

            Auto-generated by the update-readme workflow.
            - Refreshed leaderboard with current commit + PR counts
            - Synced real names & avatars from GitHub API
            - Updated repo snapshot numbers
            - Regenerated full contributor cards in CONTRIBUTORS.md
            - Regenerated point-wise CHANGELOG.md (commit-by-commit log)

            Triggered by: ${{ github.event_name }}  (cron every 12h or manual)
            Commit:       ${{ github.sha }}
          file_pattern: 'README.md CONTRIBUTORS.md CHANGELOG.md'
          branch: main              # always push to main, not the PR source branch
          commit_user_name: 'github-actions[bot]'
          commit_user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          push_options: '--force-with-lease'
          skip_checkout: true
          skip_fetch: true
