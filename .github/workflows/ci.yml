name: Code Quality CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Lint, Format & Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Run Client Linting (ESLint)
        run: |
          cd client
          npm run lint

      - name: Verify Client Build Compiles
        run: |
          cd client
          npm run build

      - name: Run Client Unit Tests
        run: |
          cd client
          npm run test
