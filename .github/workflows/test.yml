name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref — no point testing a PR twice
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs with zero npm installs — uses only Node's built-in assert module.
  # This job must always stay dependency-free so it can run instantly.
  server-bkt:
    name: BKT unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node server/lib/bkt.test.js

  # Lint the client. This catches broken imports and obvious errors before review.
  #
  # BLOCKING. `npm run lint` reports 0 errors; the remaining output is warnings only.
  # Pre-existing violations are tracked in client/eslint-suppressions.json rather than
  # ignored, so the count must never grow. A PR that adds a new violation will fail here
  # with no suppressions entry to cover it.
  #
  # Before adding a suppression entry, try to fix the violation — most were real bugs
  # (undefined variables crashing a quiz mode, not passing a prop a component reads).
  # See CONTRIBUTING.md for the update workflow and how to prune the baseline.
  client-lint:
    name: Client lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint

  # API contract tests — uses npm ci so CI fails if lockfile is out of sync.
  server-contract:
    name: API contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # MongoDB is needed by the Concept Playgrounds integration tests, which use a
    # scratch database and drop it afterwards. The topic contract tests do not
    # touch Mongo and are unaffected.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
