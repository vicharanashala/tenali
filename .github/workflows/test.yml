name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref — no point testing a PR twice
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs with zero npm installs — uses only Node's built-in assert module.
  # This job must always stay dependency-free so it can run instantly.
  server-bkt:
    name: BKT unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node server/lib/bkt.test.js

  # Lint the client. This catches broken imports and obvious errors before review.
  #
  # NON-BLOCKING (continue-on-error) until App.jsx is split up. `npm run lint`
  # currently reports ~750 pre-existing errors on main, almost all of them in
  # client/src/App.jsx (react-hooks/*, react-refresh/only-export-components).
  # While the job fails on every branch it tells a contributor nothing about
  # their own change, and a permanently red check trains everyone to ignore CI.
  #
  # The output is still produced and still worth reading — reviewers should
  # check that a PR does not ADD errors, which is easy to see by comparing the
  # count against main.
  #
  # Flip this back to blocking once the App.jsx backlog is cleared. Tracked by
  # the component-extraction epic #234.
  client-lint:
    name: Client lint
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint || true

  # API contract tests — uses npm ci so CI fails if lockfile is out of sync.
  server-contract:
    name: API contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # MongoDB is needed by the Concept Playgrounds integration tests, which use a
    # scratch database and drop it afterwards. The topic contract tests do not
    # touch Mongo and are unaffected.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  # Bundle-size budget check for client initial entry bundle (#243).
  client-bundle-budget:
    name: Client bundle budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify entry bundle budget
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const distDir = path.join(process.cwd(), "dist/assets");
            if (!fs.existsSync(distDir)) {
              console.error("Error: dist/assets directory does not exist.");
              process.exit(1);
            }
            const files = fs.readdirSync(distDir);
            const indexFile = files.find(f => /^index-.*\.js$/.test(f));
            if (!indexFile) {
              console.error("Error: Could not find entry bundle index-*.js in dist/assets.");
              process.exit(1);
            }
            const stats = fs.statSync(path.join(distDir, indexFile));
            const sizeKB = stats.size / 1024;
            const BUDGET_KB = 3500;
            console.log(`Initial entry bundle (${indexFile}): ${sizeKB.toFixed(2)} KB (Budget limit: ${BUDGET_KB} KB)`);
            if (sizeKB > BUDGET_KB) {
              console.error(`FAIL: Entry bundle ${sizeKB.toFixed(2)} KB exceeds size budget limit of ${BUDGET_KB} KB!`);
              process.exit(1);
            }
            console.log("SUCCESS: Initial entry bundle is within size budget limit.");
          '

