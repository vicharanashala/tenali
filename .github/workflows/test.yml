name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref — no point testing a PR twice
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs with zero npm installs — uses only Node's built-in assert module.
  # This job must always stay dependency-free so it can run instantly.
  server-bkt:
    name: BKT unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node server/lib/bkt.test.js

  # Lint the client. This catches broken imports and obvious errors before review.
  #
  # BLOCKING (#338). The pre-existing errors, almost all in client/src/App.jsx,
  # are baselined per file and per rule in client/eslint-suppressions.json
  # (#277), so `npm run lint` passes on main and only NEW errors fail it.
  #
  # Fixed a baselined error? Run `npx eslint . --prune-suppressions` in
  # client/ and commit the updated file. ESLint fails while the file lists
  # errors that no longer exist, so the baseline can only shrink.
  client-lint:
    name: Client lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint

  # Frontend unit tests (Vitest + jsdom) — added by issue #294.
  # Blocking, like client-lint: the suite starts out small and green,
  # so a failure here means the PR genuinely broke something. It lives in this
  # existing "Tests" workflow on purpose — do not spin up a competing
  # workflow file for client tests.
  client-test:
    name: Client tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test

  # API contract tests — uses npm ci so CI fails if lockfile is out of sync.
  server-contract:
    name: API contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # MongoDB is needed by the Concept Playgrounds integration tests, which use a
    # scratch database and drop it afterwards. The topic contract tests do not
    # touch Mongo and are unaffected.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
