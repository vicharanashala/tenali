name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref — no point testing a PR twice
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs with zero npm installs — uses only Node's built-in assert module.
  # This job must always stay dependency-free so it can run instantly.
  server-bkt:
    name: BKT unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node server/lib/bkt.test.js

    # Lint the client. ESLint suppressions baseline existing issues so new
    # unsuppressed lint errors fail CI.
  client-lint:
    name: Client lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint

  # Frontend unit tests (Vitest + jsdom) — added by issue #294.
  # Unlike client-lint this is blocking: the suite starts out small and green,
  # so a failure here means the PR genuinely broke something. It lives in this
  # existing "Tests" workflow on purpose — do not spin up a competing
  # workflow file for client tests.
  client-test:
    name: Client tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test

  # API contract tests — uses npm ci so CI fails if lockfile is out of sync.
  server-contract:
    name: API contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # MongoDB is needed by the Concept Playgrounds integration tests, which use a
    # scratch database and drop it afterwards. The topic contract tests do not
    # touch Mongo and are unaffected.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  # Dependency audit — what `npm audit` sees in each committed lockfile.
  #
  # This job exists because nothing else here could notice a vulnerable
  # dependency: the test, lint and contract jobs were all green while
  # server/package-lock.json shipped proxy-addr 2.0.7 (GHSA-jqcg-44mw-7w3h,
  # critical — the component that derives the client IP the login rate
  # limiter keys on). The lockfile is what `npm ci` installs on every
  # deploy, so the lockfile is what has to be audited.
  #
  # NON-BLOCKING today, exactly like client-lint: the client tree still
  # carries one high advisory that can only be cleared by replacing
  # face-api.js (tracked in #468), and a permanently red check trains
  # everyone to ignore CI. Flip it to blocking when both trees are clean.
  #
  # No `npm ci` here on purpose — `npm audit` reads the lockfile, so the job
  # stays fast and cannot be affected by an install failure.
  dependency-audit:
    name: Dependency audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package: [client, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Audit the committed lockfile
        run: npm audit --audit-level=high --omit=dev
        working-directory: ${{ matrix.package }}
