name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref — no point testing a PR twice
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs with zero npm installs — uses only Node's built-in assert module.
  # This job must always stay dependency-free so it can run instantly.
  server-bkt:
    name: BKT unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node server/lib/bkt.test.js

  # Lint the client. This catches broken imports and obvious errors before review.
  client-lint:
    name: Client lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint

  # API contract tests — uses npm ci so CI fails if lockfile is out of sync.
  server-contract:
    name: API contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
